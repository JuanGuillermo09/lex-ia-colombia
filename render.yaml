databases:
  - name: lexia-db
    plan: free
    databaseName: lexia_db
    user: lexia

services:
  - type: web
    name: lexia-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --include=dev --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lexia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: fallback
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: https://lex-ia-colombia.onrender.com,https://lexia-frontend.onrender.com
      - key: PORT
        value: "3000"
