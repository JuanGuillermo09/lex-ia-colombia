databases:
  - name: lexia-db
    plan: free
    databaseName: lexia_db
    user: lexia

services:
  - type: web
    name: lexia-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma generate && npx prisma migrate deploy && npx tsx scripts/seed.ts && node -r tsconfig-paths/register dist/app.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lexia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://lexia-frontend.onrender.com
      - key: PORT
        value: "3000"

  - type: static
    name: lexia-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/browser
    envVars:
      - key: API_URL
        value: https://lexia-backend.onrender.com
      - key: CI
        value: "false"
