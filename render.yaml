databases:
  - name: lexia-db
    plan: free
    databaseName: lexia_db
    user: lexia

services:
  - type: web
    name: lexia-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && npx prisma generate
    startCommand: npx prisma migrate deploy && npx tsx scripts/seed.ts && npx tsx src/app.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lexia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://lexia-frontend.onrender.com
      - key: PORT
        value: "3000"
