<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    class="sidenav"
  >
    <div class="sidenav-header">
      <mat-icon>gavel</mat-icon>
      <span>LexIA Colombia</span>
      <button mat-icon-button class="close-btn" (click)="sidenav.close()" *ngIf="isMobile">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" (click)="isMobile && sidenav.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/chat" routerLinkActive="active-link" (click)="isMobile && sidenav.close()">
        <mat-icon matListItemIcon>chat</mat-icon>
        <span matListItemTitle>Chat</span>
      </a>
      <a mat-list-item routerLink="/history" routerLinkActive="active-link" (click)="isMobile && sidenav.close()">
        <mat-icon matListItemIcon>history</mat-icon>
        <span matListItemTitle>Historial</span>
      </a>
      <a mat-list-item routerLink="/profile" routerLinkActive="active-link" (click)="isMobile && sidenav.close()">
        <mat-icon matListItemIcon>person</mat-icon>
        <span matListItemTitle>Perfil</span>
      </a>
      <ng-container *ngIf="(authService.user$ | async)?.role === 'ADMIN'">
        <mat-divider></mat-divider>
        <div class="nav-section-title">Administración</div>
        <a mat-list-item routerLink="/admin" routerLinkActive="active-link" (click)="isMobile && sidenav.close()">
          <mat-icon matListItemIcon>description</mat-icon>
          <span matListItemTitle>Documentos</span>
        </a>
        <a mat-list-item routerLink="/admin/users" routerLinkActive="active-link" (click)="isMobile && sidenav.close()">
          <mat-icon matListItemIcon>people</mat-icon>
          <span matListItemTitle>Usuarios</span>
        </a>
        <a mat-list-item routerLink="/admin/stats" routerLinkActive="active-link" (click)="isMobile && sidenav.close()">
          <mat-icon matListItemIcon>bar_chart</mat-icon>
          <span matListItemTitle>Estadísticas</span>
        </a>
        <a mat-list-item routerLink="/admin/articles" routerLinkActive="active-link" (click)="isMobile && sidenav.close()">
          <mat-icon matListItemIcon>menu_book</mat-icon>
          <span matListItemTitle>Ver Artículos</span>
        </a>
      </ng-container>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-spacer"></span>
      <span class="user-info">{{ (authService.user$ | async)?.name }}</span>
      <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon> Perfil
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon> Cerrar sesión
        </button>
      </mat-menu>
    </mat-toolbar>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
