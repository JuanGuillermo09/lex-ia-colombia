<mat-card class="auth-card">
  <mat-card-content>
    <h2>Nueva contraseña</h2>
    <p class="subtitle">Ingresa tu nueva contraseña</p>
    <form (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nueva contraseña</mat-label>
        <input matInput type="password" [(ngModel)]="newPassword" name="newPassword" required minlength="8">
        <mat-icon matPrefix>lock</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirmar contraseña</mat-label>
        <input matInput type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required minlength="8">
        <mat-icon matPrefix>lock</mat-icon>
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="loading">
        {{ loading ? 'Restableciendo...' : 'Restablecer contraseña' }}
      </button>
    </form>
    <p class="auth-link">
      <a routerLink="/login">Volver a iniciar sesión</a>
    </p>
  </mat-card-content>
</mat-card>
