<mat-card class="auth-card">
  <mat-card-content>
    <h2>Recuperar contraseña</h2>
    <p class="subtitle" *ngIf="!sent">Ingresa tu correo para recibir un código de verificación</p>
    <form (ngSubmit)="onSubmit()" *ngIf="!sent">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" [(ngModel)]="email" name="email" required>
        <mat-icon matPrefix>email</mat-icon>
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="loading">
        {{ loading ? 'Enviando...' : 'Enviar código' }}
      </button>
    </form>
    <div *ngIf="sent" class="sent-info">
      <mat-icon class="sent-icon">check_circle</mat-icon>
      <p class="sent-text">Código enviado a <strong>{{ email }}</strong></p>
      <p class="sent-sub">El código expira en <strong>5 minutos</strong></p>
      <div *ngIf="sentCode" class="dev-code">
        <p class="dev-label">⚠️ Modo desarrollo — sin SMTP configurado</p>
        <p class="dev-value">{{ sentCode }}</p>
      </div>
      <button mat-raised-button color="primary" (click)="goToVerify()" class="full-width">
        Ingresar código
      </button>
    </div>
    <p class="auth-link">
      <a routerLink="/login">Volver a iniciar sesión</a>
    </p>
  </mat-card-content>
</mat-card>
