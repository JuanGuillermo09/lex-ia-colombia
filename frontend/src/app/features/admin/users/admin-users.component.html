<div class="admin-users">
  <h1>Gestión de Usuarios</h1>

  <div class="table-wrapper">
  <table mat-table [dataSource]="users" class="users-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let user">{{ user.name }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Correo</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Rol</th>
      <td mat-cell *matCellDef="let user">
        <mat-select [value]="user.role" (selectionChange)="updateRole(user.id, $event.value)">
          <mat-option value="USER">Usuario</mat-option>
          <mat-option value="ADMIN">Administrador</mat-option>
        </mat-select>
      </td>
    </ng-container>
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Fecha de registro</th>
      <td mat-cell *matCellDef="let user">{{ user.createdAt | date:'medium' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let user">
        <button mat-icon-button color="primary" [routerLink]="['/admin/users', user.id, 'conversations']" [state]="{ name: user.name }" matTooltip="Ver conversaciones">
          <mat-icon>chat</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteUser(user.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>
  </div>

  <mat-paginator
    *ngIf="totalPages > 1"
    [length]="total"
    [pageSize]="limit"
    (page)="onPageChange($event)"
  ></mat-paginator>
</div>
